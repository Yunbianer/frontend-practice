<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自习室查询 - 校园生活服务中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- 顶部导航 -->
  <nav class="navbar navbar-expand-lg fixed-top site-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="fa-solid fa-graduation-cap"></i>校园生活服务中心
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
              aria-controls="navMenu" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" data-page="home" href="index.html">首页总览</a></li>
          <li class="nav-item"><a class="nav-link active" data-page="study" href="study.html">自习室查询</a></li>
          <li class="nav-item"><a class="nav-link" data-page="canteen" href="canteen.html">食堂信息</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <h1>自习室查询与管理</h1>
      <p>实时查询空闲座位，支持搜索、筛选、新增与修改，数据保存在本地浏览器。</p>
    </div>
  </header>

  <main class="container">

    <!-- ===== 工具栏：搜索 + 筛选 + 添加 ===== -->
    <section class="card-custom p-3 mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label small text-muted mb-1">关键词搜索</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="输入自习室名称…">
          </div>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small text-muted mb-1">楼栋</label>
          <select id="filterBuilding" class="form-select">
            <option value="">全部</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small text-muted mb-1">状态</label>
          <select id="filterStatus" class="form-select">
            <option value="">全部</option>
            <option value="开放">开放</option>
            <option value="满座">满座</option>
            <option value="快满">快满</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small text-muted mb-1">仅看空调</label>
          <select id="filterAircon" class="form-select">
            <option value="">全部</option>
            <option value="true">有空调</option>
            <option value="false">无空调</option>
          </select>
        </div>
        <div class="col-6 col-md-2 d-grid">
          <button id="btnAdd" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> 新增自习室
          </button>
        </div>
      </div>
      <div class="mt-2 d-flex justify-content-between align-items-center">
        <small id="resultCount" class="text-muted">共 0 条记录</small>
        <button id="btnReset" class="btn btn-sm btn-link text-muted">
          <i class="fa-solid fa-rotate-left"></i> 恢复默认数据
        </button>
      </div>
    </section>

    <!-- ===== 列表 ===== -->
    <section id="roomList"></section>

  </main>

  <footer class="site-footer">
    <div>© 2026 校园自习与生活服务中心 · <a href="help.html" class="text-white-50">运行说明</a> · 课程设计作品</div>
  </footer>

  <!-- ===== 新增/编辑 模态框 ===== -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">新增自习室</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <form id="editForm" class="row g-3">
            <input type="hidden" id="f_id">
            <div class="col-md-6">
              <label class="form-label">名称 *</label>
              <input type="text" id="f_name" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">楼栋 *</label>
              <select id="f_building" class="form-select" required>
                <option value="">请选择</option>
                <option>图书馆</option>
                <option>第一教学楼</option>
                <option>第二教学楼</option>
                <option>综合楼</option>
                <option>实验楼</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">楼层</label>
              <input type="number" id="f_floor" class="form-control" min="1" value="1">
            </div>
            <div class="col-md-4">
              <label class="form-label">总座位 *</label>
              <input type="number" id="f_totalSeats" class="form-control" min="0" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">空闲座位 *</label>
              <input type="number" id="f_freeSeats" class="form-control" min="0" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">开放时间</label>
              <input type="text" id="f_openTime" class="form-control" placeholder="如 07:00-22:30">
            </div>
            <div class="col-md-4">
              <label class="form-label">安静等级</label>
              <select id="f_quietLevel" class="form-select">
                <option>静音</option>
                <option>普通</option>
                <option>讨论</option>
              </select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f_hasAircon">
                <label class="form-check-label" for="f_hasAircon">配备空调</label>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label">标签（英文逗号分隔）</label>
              <input type="text" id="f_tags" class="form-control" placeholder="如 空调,静音,插座充足">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" id="btnSave" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 依赖库 -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/study.js"></script>
</body>
</html>
